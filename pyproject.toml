[project]
name = "hotel-khqr-payment-service"
version = "0.1.0"
description = "FastAPI KHQR payment microservice for the Hotel Booking System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
# Community adapter. Review and pin the exact approved version before production.
bakong = ["bakong-khqr>=0.6,<0.7"]
test = ["pytest>=8.4,<9.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
